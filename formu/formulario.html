<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="shortcut icon" href="https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Mattel_%282019%29.svg/1280px-Mattel_%282019%29.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" type="image/x-icon">
    <link rel="stylesheet" href="formulario.css">
</head>

<body>

    <header>
        <img src="../img/Logo.png" alt="Logo">

        <div class="menu" id="btn">
            <img src="../img/menu.png" alt="Abrir menu" id="menu">
            <img src="../img/close.png" alt="Fechar menu" class="mn" id="menuC">
        </div>

        <div class="nav" id="nav">
            <nav id="nav2">
                <a href="../index.html">Inicio</a>
                <a href="../Compreoudoe.html">Compra</a>
                <a href="../sobre-nos.html">Sobre nós</a>
                <a href="../comodoar.html">Como doar</a>
            </nav>
        </div>

        <img src="../img/Uno2.png" alt="">
    </header>

    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    </head>

    <main>

        <section class="formulario">

            <!-- LOGO -->
            <img class="logo-mattel" src="../img/LogoM.png" alt="Mattel">

            <form>

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome">
                </div>

                <div class="campo">
                    <label for="brinquedo">Nome do Brinquedo</label>
                    <input type="text" id="brinquedo" name="brinquedo">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="campo">
                    <label for="data">Data da Entrega</label>
                    <input type="date" id="data" name="data">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>

                <div class="campo estado">

                    <label>Estado do Brinquedo</label>

                    <div class="opcoes">

                        <label>
                            <input type="radio" name="estado" value="novo">
                            Novo
                        </label>

                        <label>
                            <input type="radio" name="estado" value="semi-novo">
                            Semi Novo
                        </label>

                        <label>
                            <input type="radio" name="estado" value="usado">
                            Usado em Bom estado
                        </label>

                    </div>

                </div>

                <a href="jurrasic.html">
                    <button class="squishy squishy-classic">
                        Fazer Doação
                </a>

            </form>

        </section>

    </main>

    <script src="../script.js"></script>
</body>

</html>
