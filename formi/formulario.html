<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formulario.css">
</head>

<body>

    <header>
        <img src="imagens/menu.png" alt="Logo">

        <div class="menu">
            <img src="imagens/menu (1).png" alt="Menu">
        </div>

        <nav>
            <a>Inicio</a>
            <a>Compra</a>
            <a>Sobre nos</a>
            <a>Como doar</a>
        </nav>

        <img src="imagens/Uno2.png" alt="">
    </header>

    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    </head>

    <main>

        <section class="formulario">

            <!-- LOGO -->
            <img class="logo-mattel" src="imagens/mattellogo.png" alt="Mattel">

            <form>

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome">
                </div>

                <div class="campo">
                    <label for="brinquedo">Nome do Brinquedo</label>
                    <input type="text" id="brinquedo" name="brinquedo">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="campo">
                    <label for="data">Data da Entrega</label>
                    <input type="date" id="data" name="data">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>

                <div class="campo estado">

                    <label>Estado do Brinquedo</label>

                    <div class="opcoes">

                        <label>
                            <input type="radio" name="estado" value="novo">
                            Novo
                        </label>

                        <label>
                            <input type="radio" name="estado" value="semi-novo">
                            Semi Novo
                        </label>

                        <label>
                            <input type="radio" name="estado" value="usado">
                            Usado em Bom estado
                        </label>

                    </div>

                </div>

                <a href="jurrasic.html">
                <button class="squishy squishy-classic" >                    
                    Fazer Doação
                </a>

            </form>

        </section>

    </main>

</body>

</html>
